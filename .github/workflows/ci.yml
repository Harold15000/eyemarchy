name: CI

# Manual for now: run it from the Actions tab. Locally: see CONTRIBUTING.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Manifest
        run: |
          jq -e '.schemaVersion == 1' manifest.json
          jq -e '.id | test("^[A-Za-z0-9][A-Za-z0-9._-]*$") and (startswith("omarchy.") | not)' manifest.json
          for f in name version kinds entryPoints; do jq -e --arg f "$f" 'has($f)' manifest.json; done
          jq -r '.entryPoints[]' manifest.json | while read -r ep; do
            case "$ep" in /*|*..*) echo "unsafe entry point: $ep"; exit 1 ;; esac
            test -f "$ep" || { echo "missing entry point: $ep"; exit 1; }
          done
          test -z "$(find . -type l -not -path './.git/*')" || { echo "symlinks are not allowed"; exit 1; }

      - name: Python collectors
        run: python3 -m unittest discover -s tests -v

      - name: Settings and translations
        run: node --test tests/*.mjs

      - name: Scripts compile
        run: python3 -m py_compile scripts/*.py
